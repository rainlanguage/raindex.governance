[suite]
root = "../.."
command = ["sh", "audit/mutation-probe/check.sh"]
proof = '(\d+) tests passed, (\d+) failed'
fail-pattern = '(?m)^\[FAIL.*\] ((?:test|invariant)\w*)\('
timeout-secs = 1500

[[mutants]]
name = "M01 ctor zero-admin check dropped"
file = "src/RaindexInventory.sol"
target = "admin_ == address(0) || "
replacement = ""

[[mutants]]
name = "M02 ctor zero-raindex check dropped"
file = "src/RaindexInventory.sol"
target = " || address(raindex_) == address(0)"
replacement = ""

[[mutants]]
name = "M03 RAINDEX bound to wrong address"
file = "src/RaindexInventory.sol"
target = "RAINDEX = raindex_;"
replacement = "RAINDEX = IRaindexV6(address(1));"

[[mutants]]
name = "M04 admin role granted to deployer"
file = "src/RaindexInventory.sol"
target = "_grantRole(DEFAULT_ADMIN_ROLE, admin_);"
replacement = "_grantRole(DEFAULT_ADMIN_ROLE, msg.sender);"

[[mutants]]
name = "M05 OPERATOR_ROLE hash changed"
file = "src/RaindexInventory.sol"
target = "keccak256(\"OPERATOR_ROLE\")"
replacement = "keccak256(\"OPERATOR\")"

[[mutants]]
name = "M06 gate excludes admin"
file = "src/RaindexInventory.sol"
target = "!hasRole(DEFAULT_ADMIN_ROLE, msg.sender) && !hasRole(OPERATOR_ROLE, msg.sender)"
replacement = "!hasRole(OPERATOR_ROLE, msg.sender)"

[[mutants]]
name = "M07 gate excludes operator"
file = "src/RaindexInventory.sol"
target = "!hasRole(DEFAULT_ADMIN_ROLE, msg.sender) && !hasRole(OPERATOR_ROLE, msg.sender)"
replacement = "!hasRole(DEFAULT_ADMIN_ROLE, msg.sender)"

[[mutants]]
name = "M08 gate and->or"
file = "src/RaindexInventory.sol"
target = "!hasRole(DEFAULT_ADMIN_ROLE, msg.sender) && !hasRole(OPERATOR_ROLE, msg.sender)"
replacement = "!hasRole(DEFAULT_ADMIN_ROLE, msg.sender) || !hasRole(OPERATOR_ROLE, msg.sender)"

[[mutants]]
name = "M09 gate error names admin role"
file = "src/RaindexInventory.sol"
