[package]
name = "raindex-governance"
version = "0.1.0"

[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc = "0.8.25"
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
optimizer = true
optimizer_runs = 1000000
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 5096

[soldeer]
recursive_deps = false

[dependencies]
forge-std = "1.16.1"
rain-interpreter-interface = "0.1.0"
rain-math-float = "0.1.1"
raindex-interface = "0.1.2"
"@openzeppelin-contracts" = "5.1.0"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
bsc = "${BSC_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}" }
bsc = { key = "${CI_DEPLOY_BSC_ETHERSCAN_API_KEY}", chain = 56 }
ethereum = { key = "${CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY}", chain = 1 }
hyperevm = { key = "${CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY}", chain = 999 }
# Robinhood Chain (4663) has no entry on purpose: Etherscan V2 does not index
# it. `deploy-inventory.yaml` verifies that network through Sourcify.
